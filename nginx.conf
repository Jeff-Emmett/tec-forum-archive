server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;  # behind Cloudflare: keep the visitor's https scheme

    # archived post HTML is third-party content: no inline script, no framing
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # old forum URL shapes
    rewrite ^/t/([^/]+)/(\d+)/(\d+)/?$ /t/$1/$2/#post_$3 redirect;
    rewrite ^/t/([^/]+)/(\d+)$ /t/$1/$2/ redirect;
    rewrite ^/t/(\d+)$ /t/$1/ redirect;
    rewrite ^/c/(?:[^/]+/)*([a-z0-9-]+)/\d+/?$ /c/$1/ redirect;
    rewrite ^/u/([^/]+)/(?:summary|activity.*)$ /u/$1/ redirect;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|png|jpe?g|gif|webp|avif|svg|ico|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;
}
