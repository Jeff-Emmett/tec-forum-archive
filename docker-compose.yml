services:
  tec-forum-archive:
    build: .
    container_name: tec-forum-archive
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.http.routers.tec-forum-archive.rule=Host(`tec.mycostack.xyz`)
      - traefik.http.routers.tec-forum-archive.entrypoints=web
      - traefik.http.services.tec-forum-archive.loadbalancer.server.port=80
      - traefik.docker.network=traefik-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
networks:
  traefik-public:
    external: true
